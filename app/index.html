<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Editions Explorer v4.2 (Compact)</title>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <!-- D3 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        #map {
            background: #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
            z-index: 10;
        }

        .chart-container {
            height: 200px;
        }

        .topic-keywords {
            display: none;
        }

        .topic-item:hover .topic-keywords {
            display: block;
        }

        /* Marker Cluster Custom Styling */
        .marker-cluster-small,
        .marker-cluster-medium,
        .marker-cluster-large {
            background-color: rgba(14, 165, 233, 0.4) !important;
        }

        .marker-cluster-small div,
        .marker-cluster-medium div,
        .marker-cluster-large div {
            background-color: rgba(14, 165, 233, 0.8) !important;
            color: white !important;
            font-weight: bold !important;
        }

        .bar {
            fill: #0ea5e9;
            /* Sky 500 */

            cursor: pointer;
        }

        .bar:hover {
            fill: #0369a1;
            /* Sky 700 */
        }

        .bar.active {
            fill: #f59e0b;
            /* Amber 500 */
        }

        .brush .selection {
            fill: #f59e0b;
            fill-opacity: 0.3;
            stroke: #f59e0b;
        }

    <script>
        // --- Dynamic Filter Logic ---
        // Tags now live in SQL (tags / document_tags, see db/001_add_tags.sql).
        // The modal queries /api/tags; matching happens server-side in
        // /api/dashboard, driven by the customFilters payload.

        function showAddFilterModal() {
            document.getElementById('filterModal').classList.remove('hidden');
            document.getElementById('filterCustomName').value = '';
            document.getElementById('tagSearch').value = '';
            SELECTED_TAGS.clear();
            renderTagList();
        }
        function closeAddFilterModal() {
            document.getElementById('filterModal').classList.add('hidden');
        }

        function confirmAddFilter() {
            const tags = [...SELECTED_TAGS];
            if (tags.length === 0) return;

            // Determine filter display name
            let name = (document.getElementById('filterCustomName').value || '').trim();
            if (!name) name = tags.length === 1 ? tags[0] : tags.join(' + ');

            const key = CUSTOM_PREFIX + name;

            // Skip if already present
            if (DYNAMIC_FEATURES.has(key)) { closeAddFilterModal(); return; }
            DYNAMIC_FEATURES.add(key);

            // The tag list travels to the API on every request; the server does
            // the matching, so there is nothing to compute client-side.
            DYNAMIC_FILTER_META[key] = { label: name, tags };

            closeAddFilterModal();
            updateDashboard();
        }

        function removeDynamicFeature(key) {
            if (!DYNAMIC_FEATURES.has(key)) return;
            DYNAMIC_FEATURES.delete(key);
            delete DYNAMIC_FILTER_META[key];

            if (FILTERS.feature && FILTERS.feature.key === key) {
                FILTERS.feature = null;
            }
            updateDashboard();
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        let tagSearchTimer = null;
        // Called from the search box's onkeyup. Debounced so typing doesn't
        // fire a query per keystroke.
        function renderTagList() {
            clearTimeout(tagSearchTimer);
            tagSearchTimer = setTimeout(fetchAndRenderTagList, 200);
        }

        async function fetchAndRenderTagList() {
            const list = document.getElementById('tagList');
            const searchInput = document.getElementById('tagSearch');
            const search = searchInput ? searchInput.value.trim() : '';

            list.innerHTML = '<div class="text-xs text-gray-400 px-2 py-1">Loading tags…</div>';

            let tags;
            try {
                const res = await fetch(`/api/tags?limit=500&search=${encodeURIComponent(search)}`);
                const payload = await res.json();
                if (!res.ok) throw new Error(payload.error || 'Request failed');
                tags = payload.tags || [];
            } catch (err) {
                console.error('Could not load tags', err);
                list.innerHTML =
                    `<div class="text-xs text-rose-500 px-2 py-1">Could not load tags: ${escapeHtml(err.message)}</div>`;
                return;
            }

            list.innerHTML = '';
            if (tags.length === 0) {
                list.innerHTML = '<div class="text-xs text-gray-400 px-2 py-1">No matching tags.</div>';
                return;
            }

            tags.forEach(({ name, doc_count }) => {
                const label = document.createElement('label');
                label.className = 'flex items-center gap-2 px-2 py-1.5 rounded hover:bg-gray-50 cursor-pointer';
                label.innerHTML =
                    `<input type="checkbox" class="accent-gray-600 shrink-0"${SELECTED_TAGS.has(name) ? ' checked' : ''}>`
                    + `<span class="font-mono text-xs text-gray-700 flex-1">&lt;${escapeHtml(name)}&gt;</span>`
                    + `<span class="text-xs text-gray-400">${(doc_count || 0).toLocaleString()}</span>`;
                // Selection is tracked outside the DOM so it survives re-renders
                // when the user narrows the search.
                label.querySelector('input').addEventListener('change', (e) => {
                    if (e.target.checked) SELECTED_TAGS.add(name);
                    else SELECTED_TAGS.delete(name);
                });
                list.appendChild(label);
            });
        }
    </script>
    <script>
        // --- Global State ---
        // All aggregation happens server-side in /api/dashboard. The client
        // holds filter state, the topic hierarchy, and edition metadata only.
        const CUSTOM_PREFIX = '__custom__';

        let VIEW_MODE = 'document'; // 'document' | 'edition'
        let FILTERS = {
            lang: null,
            country: null,
            city: null,
            yearRange: null,
            feature: null,              // { key, value } - built-in attribute or __custom__ tag filter
            topicId: null,
            dateSource: 'contextual',   // 'creation' | 'publication' | 'contextual'
            geoSource: 'contextual'     // 'creation' | 'publication' | 'contextual'
        };
        let ALL_FEATURES = [];
        let EDITION_METADATA = {};
        let TOPIC_HIERARCHY = [];
        let DYNAMIC_FEATURES = new Set();
        let DYNAMIC_FILTER_META = {};   // key -> { label, tags }
        let SELECTED_TAGS = new Set();  // checkbox state inside the tag modal
        let SHOW_CONTEXTUAL = true;

        // Leaflet handles
        let map;
        let cityClusters;

        /** Tag lists for every active custom filter, sent with each request. */
        function customFilterPayload() {
            return [...DYNAMIC_FEATURES]
                .filter(key => DYNAMIC_FILTER_META[key])
                .map(key => ({ key, tags: DYNAMIC_FILTER_META[key].tags }));
        }

        // Load Data
        const t = Date.now();
        Promise.all([
            fetch('/api/dashboard').then(res => {
                if (!res.ok) {
                    return res.json().then(err => {
                        throw new Error(err.error || err.message || `HTTP error ${res.status}`);
                    });
                }
                return res.json();
            }),
            d3.json(`topics_hierarchy.json?v=${t}`)
        ]).then(([dbMeta, topicRes]) => {
            TOPIC_HIERARCHY = topicRes;
            ALL_FEATURES = dbMeta.features || [];

            // Set up editions metadata
            EDITION_METADATA = {};
            dbMeta.editions.forEach(ed => {
                EDITION_METADATA[ed.name] = ed;
            });

            initMap();
            renderTopicHierarchy(topicRes);
            updateDashboard();
        }).catch(err => {
            console.error("Error loading data:", err);
            document.body.innerHTML = `<div class="p-10 text-red-600">Error loading data from SQL database.<br>${err}</div>`;
        });

        // --- Core Logic ---

        function setMode(mode) {
            VIEW_MODE = mode;
            // Update buttons
            const btnDoc = document.getElementById('btn-doc');
            const btnEd = document.getElementById('btn-ed');
            const activeClass = "bg-white shadow text-gray-800";
            const inactiveClass = "text-gray-500 hover:text-gray-700";

            if (mode === 'document') {
                btnDoc.className = "px-3 py-1.5 rounded transition-all text-sm " + activeClass;
                btnEd.className = "px-3 py-1.5 rounded transition-all text-sm " + inactiveClass;
                document.getElementById('legend-label').innerText = "Doc Count";
            } else {
                btnEd.className = "px-3 py-1.5 rounded transition-all text-sm " + activeClass;
                btnDoc.className = "px-3 py-1.5 rounded transition-all text-sm " + inactiveClass;
                document.getElementById('legend-label').innerText = "Edition Count";
            }
            updateDashboard();
        }

        function setDateSource(source) {
            FILTERS.dateSource = source;
            FILTERS.yearRange = null; // Reset year filter when switching axes
            document.getElementById('btn-date-cre').className = "px-3 py-1 transition-all text-gray-500 hover:text-gray-700";
            document.getElementById('btn-date-pub').className = "px-3 py-1 transition-all text-gray-500 hover:text-gray-700";
            document.getElementById('btn-date-con').className = "px-3 py-1 rounded shadow bg-white text-gray-800 transition-all";

            const btnId = `btn-date-${source.substring(0, 3)}`;
            document.getElementById(btnId).className = "px-3 py-1 rounded shadow bg-white text-gray-800 transition-all";

            updateDashboard();
        }

        function setGeoSource(source) {
            FILTERS.geoSource = source;
            document.getElementById('btn-geo-cre').className = "flex-1 px-2 py-1 transition-all text-gray-500 hover:text-gray-700";
            document.getElementById('btn-geo-pub').className = "flex-1 px-2 py-1 transition-all text-gray-500 hover:text-gray-700";

        async function updateDashboard() {
            document.getElementById('statsline').innerHTML = "Loading data from database...";

            try {
                const res = await fetch('/api/dashboard', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        filters: FILTERS,
                        viewMode: VIEW_MODE,
                        customFilters: customFilterPayload()
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Dashboard API returned an error');

                renderStatsLine(data.totalDocs, data.totalEditions);
                renderLangChart(data.langs);
                renderCityList(data.cities);

                const totalCount = (VIEW_MODE === 'document') ? data.totalDocs : data.totalEditions;
                renderFeatureChart(data.features, totalCount);
                renderTimeChart(data.years);
                updateMap(data.cities);
                renderEditionList(new Set(data.editions));

                // Topics hierarchy counts
                const activeTopics = new Map(Object.entries(data.topics || {}));

                // Attach counts to hierarchy
                function attachCounts(topics) {
                    topics.forEach(t => {
                        t.total_count = activeTopics.get(t.id) || 0;
                        if (t.subtopics && t.subtopics.length > 0) {
                            attachCounts(t.subtopics);
                        }
                    });
                }
                attachCounts(TOPIC_HIERARCHY);
                renderTopicHierarchy(TOPIC_HIERARCHY, activeTopics);

            } catch (err) {
                console.error("Error updating dashboard:", err);
                document.getElementById('statsline').innerHTML =
                    `<span class="text-rose-400">${escapeHtml(err.message || 'Failed to connect to database API.')}</span>`;
            }
        }

        // --- SEARCH INTEGRATION ---
        let SEARCH_APPLIED = false;

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            document.getElementById('clearSearch').classList.add('hidden');
            document.getElementById('searchMessage').classList.add('hidden');
            document.getElementById('searchStatus').classList.add('hidden');
            // /api/interpret only ever sets the ordinary facet filters, so
            // clearing the query means clearing whatever those were set to.
            if (SEARCH_APPLIED) {
                SEARCH_APPLIED = false;
                resetFilters();
            }

        async function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const statusEl = document.getElementById('searchStatus');

            if (!query) {
                return;
            }

            statusEl.textContent = "Searching...";
            statusEl.classList.remove('hidden');

            try {
                const res = await fetch('/api/interpret', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                if (!res.ok) throw new Error("API Error");

                const data = await res.json();
                console.log("Search response:", data.data);

                applyBackendFacets(data.data.facets);

                // Show LLM message where "Done." used to appear
                const msg = data.data && data.data.message;
                statusEl.textContent = msg || "Done.";
                statusEl.classList.remove('hidden');

                // Only auto-hide if it's just "Done.". Keep LLM messages permanent until cleared.
                if (!msg) {
                    setTimeout(() => statusEl.classList.add('hidden'), 2000);
                }

            } catch (err) {
                console.error(err);
                statusEl.textContent = "Error searching. See console.";
                statusEl.classList.remove('hidden');
            }
        }

        function applyBackendFacets(facets) {
            SEARCH_APPLIED = true;
            // Reset filters logic
            FILTERS.country = null;
            FILTERS.city = null;
            FILTERS.lang = null;
            FILTERS.yearRange = null;
            FILTERS.feature = null; // Reset binary characteristics

            // Mapping from API facet names to dashboard feature keys
            const BINARY_FACET_MAPPING = {
                'medieval_manuscript': 'is_medieval_manuscript',
                'manuscript': 'is_manuscript',
                'letter': 'is_letter',
                'political_letter': 'is_political_letter',
                'verse': 'contains_verse',
                'direct_speech': 'contains_direct_speech',
                'linguistic_annotation': 'contains_linguistic_annotation',
                'theatre': 'contains_theatre',
                'east_asian_scripts': 'contains_east_asian_scripts',
                'japanese_scripts': 'contains_japanese_scripts',
                'political_protocols': 'contains_political_protocols',
                'dictionary': 'contains_dictionary',
                'inscriptions': 'contains_inscriptions',
                'law_texts': 'contains_law_texts',
                'newspaper_articles': 'contains_newspaper_articles',
                'diary': 'contains_diary'
            };

            // 1. Time
            if (facets.time && facets.time.length > 0) {
                const years = facets.time[0].values.map(y => parseInt(y)).filter(n => !isNaN(n));
                if (years.length > 0) {
                    if (years.length === 1) FILTERS.yearRange = [years[0], years[0]];
                    else FILTERS.yearRange = [Math.min(...years), Math.max(...years)];
                }
            }

            // 2. Geography
            if (facets.geography && facets.geography.length > 0) {
                const val = facets.geography[0].values[0];
                FILTERS.country = val; // Direct assignment
            }

            // 3. Language
            if (facets.language && facets.language.length > 0) {
                const langMap = { "french": "fr", "english": "en", "german": "de", "latin": "la" };
                const rawVal = facets.language[0].values[0].toLowerCase();
                FILTERS.lang = langMap[rawVal] || rawVal;
            }

            // 4. Binary Characteristics
            // Apply the first "true" binary facet found (since dashboard supports single feature filter)
            for (const [apiFacetName, dashboardKey] of Object.entries(BINARY_FACET_MAPPING)) {
                if (facets[apiFacetName] && facets[apiFacetName].length > 0) {
                    const facetData = facets[apiFacetName][0];
                    if (facetData && facetData.values && facetData.values.length > 0) {
                        const value = facetData.values[0];
                        if (value && value.toLowerCase() === 'true') {
                            console.log(`Applied binary facet: ${apiFacetName} -> ${dashboardKey}`);
                            FILTERS.feature = { key: dashboardKey, value: true };
                            break; // Apply only the first one found
                        }
                    }
                }
            }

            updateDashboard();
        }

        function toggleFeature(featKey) {

            FILTERS.feature = isActive ? null : { key: featKey, value: true };

        }

        // Keys that should never appear in the feature chart (removed/unused facets)
        const SKIP_FEATURE_KEYS = new Set(['is_historic']);

        // Keys that belong to each group
        const DOC_TYPE_KEYS = new Set([
            'is_medieval_manuscript', 'is_manuscript', 'is_letter', 'is_political_letter'
        ]);
        const CONTENT_KEYS = new Set([
            'contains_verse', 'contains_direct_speech', 'contains_linguistic_annotation',
            'contains_theatre', 'contains_east_asian_scripts', 'contains_japanese_scripts',
            'contains_political_protocols', 'contains_dictionary', 'contains_inscriptions',
            'contains_law_texts', 'contains_newspaper_articles', 'contains_diary'
        ]);

        // Explicit label overrides for keys whose auto-generated labels are unclear
        const FEATURE_LABELS = {
            'is_manuscript': 'Medieval Manuscript',
            'is_medieval_manuscript': 'Medieval Manuscript (strict)',
        };

        function renderFeatureChart(features, totalCount) {
            const container = document.getElementById('featureChart');
            container.innerHTML = "";

            // Map all entries and split into groups
            const allEntries = Object.entries(features)
                .filter(([k]) => !SKIP_FEATURE_KEYS.has(k))
                .map(([k, v]) => {
                    const meta = DYNAMIC_FILTER_META[k];
                    const label = meta ? meta.label
                        : (FEATURE_LABELS[k] || k.replace(/_/g, ' ').replace(/\bcontains\b/g, '').replace(/\bis\b/g, '').trim());
                    return { key: k, value: v, label };
                });

            const docTypeEntries = allEntries.filter(d => !DYNAMIC_FEATURES.has(d.key) && DOC_TYPE_KEYS.has(d.key)).sort((a, b) => b.value - a.value);
            const contentEntries = allEntries.filter(d => !DYNAMIC_FEATURES.has(d.key) && CONTENT_KEYS.has(d.key)).sort((a, b) => b.value - a.value);
            const otherEntries = allEntries.filter(d => !DYNAMIC_FEATURES.has(d.key) && !DOC_TYPE_KEYS.has(d.key) && !CONTENT_KEYS.has(d.key)).sort((a, b) => b.value - a.value);
            const dynamicEntries = allEntries.filter(d => DYNAMIC_FEATURES.has(d.key)).sort((a, b) => b.value - a.value);

            const totalStandard = docTypeEntries.length + contentEntries.length + otherEntries.length;
            if (totalStandard === 0 && dynamicEntries.length === 0) {
                container.innerHTML = "<div class='text-gray-400 text-xs p-2'>No features available</div>";
                return;
            }

            // Helper: build a responsive tile grid
            const renderGrid = (entries) => {
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-1.5";

                entries.forEach(d => {
                    const activeKey = FILTERS.feature ? FILTERS.feature.key : null;
                    const activeValue = FILTERS.feature ? FILTERS.feature.value : null;
                    const isKeyActive = activeKey === d.key;

                    const trueCount = d.value;
                    const falseCount = totalCount - trueCount;

                    const tile = document.createElement('div');
                    tile.className = "flex flex-col rounded border border-gray-200 bg-white overflow-hidden shadow-sm select-none";

                    const header = document.createElement('div');
                    header.className = "bg-gray-50 px-2 py-1 border-b border-gray-200 text-[10px] font-bold uppercase text-gray-700 flex justify-between items-center";

                    const labelSpan = document.createElement('span');
                    labelSpan.className = "truncate";
                    labelSpan.innerText = d.label;
                    labelSpan.title = d.label;
                    header.appendChild(labelSpan);

                    if (DYNAMIC_FEATURES.has(d.key)) {
                        const removeBtn = document.createElement('span');
                        removeBtn.className = "ml-1 text-gray-400 hover:text-red-600 cursor-pointer font-normal";
                        removeBtn.innerHTML = "&times;";
                        removeBtn.title = "Remove Tag";
                        removeBtn.onclick = (e) => { e.stopPropagation(); removeDynamicFeature(d.key); };
                        header.appendChild(removeBtn);
                    }

                    tile.appendChild(header);

                    const body = document.createElement('div');
                    body.className = "flex h-7";

                    const colTrue = document.createElement('div');
                    const isTrueActive = isKeyActive && activeValue === true;
                    colTrue.className = "flex-1 flex flex-col justify-center items-center cursor-pointer transition-colors border-r border-gray-100 "
                        + (isTrueActive ? "bg-amber-100 text-amber-900 font-bold" : "hover:bg-sky-50 text-sky-600");
                    colTrue.innerHTML = `<span style="font-size:9px" class="opacity-60 uppercase">Y</span><span style="font-size:11px">${trueCount.toLocaleString()}</span>`;
                    colTrue.onclick = (e) => {
                        e.stopPropagation();
                        FILTERS.feature = isTrueActive ? null : { key: d.key, value: true };
                        updateDashboard();
                    };

                    const colFalse = document.createElement('div');
                    const isFalseActive = isKeyActive && activeValue === false;
                    colFalse.className = "flex-1 flex flex-col justify-center items-center cursor-pointer transition-colors "
                        + (isFalseActive ? "bg-amber-100 text-amber-900 font-bold" : "hover:bg-gray-100 text-gray-400");
                    colFalse.innerHTML = `<span style="font-size:9px" class="opacity-60 uppercase">N</span><span style="font-size:11px">${falseCount.toLocaleString()}</span>`;
                    colFalse.onclick = (e) => {
                        e.stopPropagation();
                        FILTERS.feature = isFalseActive ? null : { key: d.key, value: false };
                        updateDashboard();
                    };

                    body.appendChild(colTrue);
                    body.appendChild(colFalse);
                    tile.appendChild(body);

                    const bar = document.createElement('div');
                    bar.className = "h-1 w-full bg-gray-100 flex";
                    const filler = document.createElement('div');
                    filler.style.width = `${totalCount > 0 ? (trueCount / totalCount) * 100 : 0}%`;
                    filler.className = isTrueActive ? "bg-amber-500" : (isFalseActive ? "bg-gray-300" : "bg-sky-500");
                    bar.appendChild(filler);
                    tile.appendChild(bar);

                    grid.appendChild(tile);
                });
                return grid;
            };

            // Helper: render a bar-row section (compact, one line per feature)
            const renderBarRows = (entries) => {
                const maxVal = Math.max(...entries.map(d => d.value), 1);
                entries.forEach(d => {
                    const activeKey = FILTERS.feature ? FILTERS.feature.key : null;
                    const activeValue = FILTERS.feature ? FILTERS.feature.value : null;
                    const isKeyActive = activeKey === d.key;
                    const isTrueActive = isKeyActive && activeValue === true;
                    const isFalseActive = isKeyActive && activeValue === false;
                    const trueCount = d.value;
                    const falseCount = totalCount - trueCount;
                    const pct = totalCount > 0 ? (trueCount / totalCount) * 100 : 0;

                    const row = document.createElement('div');
                    row.className = 'flex items-center gap-1.5 px-1 py-px rounded cursor-pointer select-none hover:bg-gray-50 '
                        + (isTrueActive ? 'bg-amber-50 ring-1 ring-amber-300' : isFalseActive ? 'bg-red-50 ring-1 ring-red-200' : '');
                    row.title = `TRUE: ${trueCount.toLocaleString()}  |  FALSE: ${falseCount.toLocaleString()}`;

                    // Label
                    const label = document.createElement('span');
                    label.className = 'w-36 shrink-0 truncate ' + (isTrueActive ? 'text-amber-800 font-semibold' : 'text-gray-600');
                    label.style.fontSize = '12px';
                    label.textContent = d.label;
                    row.appendChild(label);

                    // Bar track
                    const track = document.createElement('div');
                    track.className = 'flex-1 h-2 rounded bg-gray-100 relative overflow-hidden';
                    const fill = document.createElement('div');
                    fill.className = 'h-full rounded ' + (isTrueActive ? 'bg-amber-400' : isFalseActive ? 'bg-gray-300' : 'bg-sky-400');
                    fill.style.width = `${pct}%`;
                    track.appendChild(fill);
                    row.appendChild(track);

                    // Count
                    const count = document.createElement('span');
                    count.className = 'w-8 text-right shrink-0 ' + (isTrueActive ? 'text-amber-800 font-semibold' : 'text-gray-400');
                    count.style.fontSize = '11px';
                    count.textContent = trueCount.toLocaleString();
                    row.appendChild(count);

                    // Remove button (custom tags only)
                    if (DYNAMIC_FEATURES.has(d.key)) {
                        const rm = document.createElement('span');
                        rm.className = 'text-gray-300 hover:text-red-500 text-xs leading-none';
                        rm.innerHTML = '&times;';
                        rm.title = 'Remove';
                        rm.onclick = (e) => { e.stopPropagation(); removeDynamicFeature(d.key); };
                        row.appendChild(rm);
                    }

                    // Click: toggle TRUE / FALSE / off on label/bar, separate FALSE click removed for simplicity
                    row.onclick = (e) => {
                        e.stopPropagation();
                        if (isTrueActive) FILTERS.feature = null;
                        else FILTERS.feature = { key: d.key, value: true };
                        updateDashboard();
                    };

                    container.appendChild(row);
                });
            };

            // Helper: render a labelled section
            const renderSection = (title, entries, extraClass = '') => {
                if (entries.length === 0) return;
                const h = document.createElement('h4');
                h.className = `text-[10px] font-semibold text-gray-400 uppercase tracking-wider px-0.5 mb-0.5 mt-2 ${extraClass}`;

                container.appendChild(h);

                g.classList.add('mb-2');
                container.appendChild(g);
            };

            renderSection('Document Types', docTypeEntries);
            renderSection('Content Characteristics', contentEntries, 'border-t pt-1');
            renderSection('Other', otherEntries, 'border-t pt-1');

            // Custom tags
            if (dynamicEntries.length > 0) {
                renderSection('Custom Tags', dynamicEntries, 'border-t pt-1');
            }
        }

        // renderTypeChart REMOVED


        function renderTopicHierarchy(data, activeCountsMap) {
            const container = d3.select("#topicChart");
            container.html("");

            if (!data || data.length === 0) {
                container.html("<div class='text-gray-400'>No topics available</div>");
                return;
            }

            // Prepare Data: Add current count (total_count already attached at load)
            let listData = data.map(t => ({
                ...t,
                current_count: activeCountsMap ? (activeCountsMap.get(t.id) || 0) : 0
            }));

            // Sort: Active Topic First, then Count
            listData.sort((a, b) => {
                if (a.id === FILTERS.topicId) return -1;
                if (b.id === FILTERS.topicId) return 1;
                return b.current_count - a.current_count;
            });

            const maxVal = d3.max(listData, d => d.current_count) || 1;

            // Recursive function to render tree
            function renderNode(nodes, parentEl, level = 0) {
                const ul = parentEl.append("ul").attr("class", level === 0 ? "space-y-0.5" : "pl-3 border-l border-gray-200 mt-1 space-y-0.5 hidden");

                const items = ul.selectAll("li").data(nodes).enter().append("li")
                    .attr("class", "topic-item");

                const row = items.append("div")
                    .attr("class", d => {
                        const isActive = FILTERS.topicId === d.id;
                        const baseClass = "flex items-center gap-2 cursor-pointer p-1 rounded transition-colors text-xs ";
                        return baseClass + (isActive ? "bg-amber-100 border border-amber-400 shadow-sm" : "hover:bg-gray-100 border border-transparent");
                    })
                    .on("click", function (e, d) {
                        e.stopPropagation();
                        // Filter Logic
                        FILTERS.topicId = (FILTERS.topicId === d.id) ? null : d.id;
                        updateDashboard();
                    });

                // Arrow (for subtopics if any, though flat largely)
                row.append("span")
                    .attr("class", "arrow text-[10px] text-gray-400 w-3")
                    .text("");

                // Content Container
                const content = row.append("div").attr("class", "flex-1 min-w-0 group flex items-center gap-2");

                // Name Display
                const nameDiv = content.append("div")
                    .attr("class", d => "font-medium truncate flex-1 " + (FILTERS.topicId === d.id ? "text-amber-900" : "text-gray-700"))
                    .text(d => {
                        // Use stored name if "meaningful", else construct from words
                        if (d.name && d.name.length > 3 && !d.name.includes(",")) return d.name;

                        // Fix for char-based tokens (e.g. "H, O, F")
                        if (d.words && d.words.length > 0 && d.words[0].length === 1) {
                            if (d.name.includes(",") && d.name.length < 20) {
                                const fullText = d.words.join("").trim();
                                const parts = fullText.split(/\s+/).filter(s => s.length > 0);
                                return parts.slice(0, 4).join(" ");
                            }
                        }
                        return d.name;
                    })
                    .attr("title", d => {
                        const words = d.words ? d.words.slice(0, 15).join(", ") : "No keywords";
                        return `Words: ${words}`;
                    });

                // Edit Button (Visible on Hover)
                const editBtn = content.append("button")
                    .attr("class", "opacity-0 group-hover:opacity-100 text-gray-400 hover:text-blue-600 px-1")
                    .html(`<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-3"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" /></svg>`)
                    .on("click", function (e, d) {
                        e.stopPropagation();
                        startEditing(d, this.previousElementSibling, this);
                    });

                // Count Bar
                row.append("div")
                    .attr("class", d => "h-1.5 rounded ml-2 " + (FILTERS.topicId === d.id ? "bg-amber-500" : "bg-sky-300"))
                    .style("width", d => `${(d.current_count / maxVal) * 50}px`)
                    .style("min-width", d => d.current_count > 0 ? "2px" : "0px");

                row.append("span")
                    .attr("class", "text-[9px] text-gray-500 ml-1 min-w-[20px] text-right")
                    .text(d => d.current_count.toLocaleString());

                // Keywords line (shown on hover via CSS)
                items.each(function (d) {
                    if (!d.words || d.words.length === 0) return;
                    const words = d.words.slice(0, 10).join(', ');
                    d3.select(this).append('div')
                        .attr('class', 'topic-keywords pl-4 pb-0.5 text-[9px] text-gray-400 leading-tight truncate')
                        .attr('title', d.words.join(', '))
                        .text(words);
                });

                // Render children
                items.each(function (d) {
                    if (d.subtopics && d.subtopics.length > 0) {
                        renderNode(d.subtopics, d3.select(this), level + 1);
                    }
                });
            }

            renderNode(listData, container);
        }

        // --- Editing Logic ---
        function startEditing(dataObj, labelEl, btnEl) {
            const currentText = labelEl.textContent;
            const parent = labelEl.parentNode;

            // Hide Label & Btn
            labelEl.style.display = "none";
            btnEl.style.display = "none";

            // Create Input
            const form = document.createElement("div");
            form.className = "flex items-center gap-1 flex-1";
            form.innerHTML = `
                <input type="text" class="flex-1 min-w-0 text-xs border border-blue-400 rounded px-1 py-0.5" value="${currentText.replace(/"/g, '&quot;')}">
                <button class="text-green-600 hover:text-green-800"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-3"><path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z" clip-rule="evenodd" /></svg></button>
                <button class="text-red-500 hover:text-red-700"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-3"><path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z" /></svg></button>
            `;

            // Inputs
            const input = form.querySelector('input');
            const saveBtn = form.querySelector('button:first-of-type');
            const cancelBtn = form.querySelector('button:last-of-type');

            // Stop propagation on clicks inside form
            form.onclick = (e) => e.stopPropagation();

            function save() {
                const newName = input.value.trim();
                if (newName && newName !== currentText) {
                    // Log for debugging
                    console.log(`Renaming topic ${dataObj.id} from "${currentText}" to "${newName}"`);

                    // Update Global Store (Recursively find and update)
                    const updateGlobal = (nodes) => {
                        for (let t of nodes) {
                            if (t.id === dataObj.id) {
                                t.name = newName;
                                console.log(`Successfully updated topic ${t.id} to "${newName}"`);
                                return true;
                            }
                            if (t.subtopics && t.subtopics.length > 0) {
                                if (updateGlobal(t.subtopics)) return true;
                            }
                        }
                        return false;
                    };

                    if (updateGlobal(TOPIC_HIERARCHY)) {
                        // Re-render
                        updateDashboard();
                    } else {
                        console.error(`Failed to find topic ${dataObj.id} in hierarchy`);
                        alert("Error: Topic not found");
                        cancel();
                    }
                } else {
                    cancel();
                }
            }

            function cancel() {
                form.remove();
                labelEl.style.display = "";
                btnEl.style.display = "";
            }

            saveBtn.onclick = save;
            cancelBtn.onclick = cancel;
            input.onkeydown = (e) => {
                if (e.key === 'Enter') save();
                if (e.key === 'Escape') cancel();
            };

            parent.insertBefore(form, labelEl);
            input.focus();
        }



        const LANGUAGE_NAMES = {
            "en": "English", "de": "German", "fr": "French", "la": "Latin",
            "it": "Italian", "es": "Spanish", "ja": "Japanese", "zh": "Chinese",
            "nl": "Dutch", "ru": "Russian", "el": "Greek", "he": "Hebrew",
            "pt": "Portuguese", "sv": "Swedish", "tr": "Turkish", "ar": "Arabic",
            "da": "Danish", "fi": "Finnish", "no": "Norwegian", "pl": "Polish",
            "cs": "Czech", "hu": "Hungarian", "ro": "Romanian", "bg": "Bulgarian",
            "uk": "Ukrainian", "hr": "Croatian", "sr": "Serbian", "sl": "Slovenian",
            "sk": "Slovak", "lt": "Lithuanian", "lv": "Latvian", "et": "Estonian",
            "hbo": "Ancient Hebrew", "arc": "Aramaic", "grc": "Ancient Greek",
            "af": "Afrikaans", "zho": "Chinese", "gr": "Greek",
            "ca": "Catalan",
            "unknown": "Unknown"
        };

        function renderStatsLine(docs, eds) {
            document.getElementById('statsline').innerHTML = `<span class="font-bold text-gray-900">${docs.toLocaleString()}</span> Documents | <span class="font-bold text-gray-900">${eds}</span> Editions`;
        }
        function renderLangChart(langs) {
            const data = Object.entries(langs)
                .map(([k, v]) => ({
                    key: k,
                    label: LANGUAGE_NAMES[k] || k,
                    value: v.total,
                    confirmed: v.confirmed,
                    inferred: v.inferred
                }))
                .sort((a, b) => b.value - a.value)
                .slice(0, window.innerWidth < 1024 ? 8 : 15);
            drawBarChart("#langChart", data, (d) => {
                FILTERS.lang = FILTERS.lang === d.key ? null : d.key;
                updateDashboard();
            }, FILTERS.lang, true);
        }
        function renderTimeChart(yearMap) {
            const data = Object.entries(yearMap)
                .map(([y, v]) => ({
                    year: +y,
                    count: v.count || 0
                }))
                .filter(d => !isNaN(d.year)) // Filter bad years
                .sort((a, b) => a.year - b.year);
            drawTimeColumnChart("#timeChart", data);
        }

        // --- City List ---
        function renderCityList(cities) {
            const list = document.getElementById('cityList');
            list.innerHTML = "";

            const entries = Object.entries(cities)
                .map(([name, val]) => ({ name, ...val }))
                // Hide non-geocoded items from side facet (coords come from the DB API)
                .filter(c => Number.isFinite(c.lat) && Number.isFinite(c.lng))
                .sort((a, b) => b.total - a.total)
                .slice(0, 50);

            if (entries.length === 0) return;
            const maxVal = entries[0].total;

            const ul = document.createElement('ul');
            ul.className = "space-y-1";
            list.appendChild(ul);

            entries.forEach(c => {
                const isActive = FILTERS.city === c.name;
                const baseClass = "flex items-center gap-2 cursor-pointer p-1 rounded transition-colors text-xs ";
                const colorClass = isActive ? "bg-amber-100 border border-amber-400 shadow-sm" : "hover:bg-gray-100 border border-transparent";

                const li = document.createElement("li");
                const row = document.createElement("div");
                row.className = baseClass + colorClass;
                row.onclick = (e) => { e.stopPropagation(); toggleCity(c.name); };


                // Name
                const nameDiv = document.createElement("div");
                nameDiv.className = "flex-1 min-w-0 font-medium truncate " + (isActive ? "text-amber-900" : "text-gray-700");
                nameDiv.innerText = c.name;
                row.appendChild(nameDiv);

                // Single-color bar (matches Topics style)
                const bar = document.createElement("div");
                bar.className = "h-1.5 rounded ml-2 " + (isActive ? "bg-amber-500" : "bg-sky-300");
                bar.style.width = `${(c.total / maxVal) * 50}px`;
                bar.style.minWidth = c.total > 0 ? "2px" : "0px";
                row.appendChild(bar);

                // Count
                const countSpan = document.createElement("span");
                countSpan.className = "text-[9px] text-gray-500 ml-1 min-w-[20px] text-right";
                countSpan.innerText = c.total.toLocaleString();
                row.appendChild(countSpan);

                li.appendChild(row);
                ul.appendChild(li);
            });
        }

        // --- Map Logic ---
        function initMap() {
            map = L.map('map').setView([48, 10], 4);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
            cityClusters = L.markerClusterGroup();
            map.addLayer(cityClusters);

            // Fix for map visibility in flex containers
            setTimeout(() => {
                map.invalidateSize();
            }, 100);

            // Responsive Resize Handling
            window.addEventListener('resize', () => {
                map.invalidateSize();
                updateDashboard();
            });
        }
        function updateMap(cityStats) {
            if (!cityClusters) return;
            cityClusters.clearLayers();

            const entries = Object.entries(cityStats);
            let maxCount = 0;
            for (let i = 0; i < entries.length; i++) {
                if (entries[i][1].total > maxCount) maxCount = entries[i][1].total;
            }

            for (let i = 0; i < entries.length; i++) {
                const cityName = entries[i][0];
                const stats = entries[i][1];
                const count = stats.total;

                if (count === 0) continue;

                const coords = stats; // Coordinates are provided directly by DB API
                if (!coords || !Number.isFinite(coords.lat) || !Number.isFinite(coords.lng)) continue;

                let radius = 6;

                const marker = L.circleMarker([coords.lat, coords.lng], {
                    radius: radius,
                    fillColor: '#0ea5e9',
                    color: '#0369a1',
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                });

                let tooltip = `<b>${cityName}</b>: ${count} ${VIEW_MODE === 'document' ? 'documents' : 'editions'}`;
                if (stats.inferred > 0) {
                    tooltip += `<br/><span class="text-yellow-600 text-[10px]">(${stats.confirmed} confirmed, ${stats.inferred} inferred)</span>`;
                }

                marker.bindTooltip(tooltip);
                marker.on('click', () => { toggleCity(cityName); });
                cityClusters.addLayer(marker);
            }
        }

        function handleBackgroundClick(e) {
            // Avoid resetting if clicking on interactive elements that might have been missed by stopPropagation
            if (e.target.closest('button') || e.target.closest('input') || e.target.closest('.cursor-pointer')) return;
            resetFilters();
        }

        // --- D3 Helpers ---
        function drawBarChart(selector, data, onClick, activeKey, useLabel = false) {
            const container = d3.select(selector); container.html("");
            const w = container.node().clientWidth;
            const h = container.node().clientHeight || 150;
            if (w === 0) return;

            const svg = container.append("svg").attr("width", w).attr("height", h);
            const labelWidth = 150;
            const x = d3.scaleLinear().domain([0, d3.max(data, d => d.value)]).range([0, w - labelWidth - 40]);
            const y = d3.scaleBand().domain(data.map(d => d.key)).range([0, h]).padding(0.2);

            const g = svg.append("g");

            // Draw Bars (Grouped for Stacking)
            const bars = g.selectAll(".bar-group").data(data).enter().append("g")
                .attr("transform", d => `translate(${labelWidth}, ${y(d.key)})`)
                .style("cursor", "pointer")
                .on("click", (e, d) => {
                    e.stopPropagation();
                    onClick(d);
                });

            // 1. Confirmed Part (or Total)
            bars.append("rect")
                .attr("x", 0)
                .attr("height", y.bandwidth())
                .attr("width", d => x(d.confirmed !== undefined ? d.confirmed : d.value))
                .attr("fill", d => d.key === activeKey ? "#f59e0b" : "#0ea5e9"); // Amber or Sky 500

            // 2. Inferred Part (Stacked)
            bars.each(function (d) {
                if (d.inferred && d.inferred > 0) {
                    d3.select(this).append("rect")
                        .attr("x", x(d.confirmed))
                        .attr("height", y.bandwidth())
                        .attr("width", x(d.inferred))
                        .attr("fill", d.key === activeKey ? "#fbbf24" : "#bae6fd") // Lighter Amber or Sky 200
                        .append("title").text(`Inferred: ${d.inferred.toLocaleString()}`);
                }
            });

            // Labels
            g.selectAll("text.label").data(data).enter().append("text")
                .attr("x", labelWidth - 5).attr("y", d => y(d.key) + y.bandwidth() / 2 + 4).attr("text-anchor", "end")
                .text(d => useLabel ? d.label : d.key)
                .style("font-size", "12px").style("fill", "#4b5563");

            // Values
            g.selectAll("text.val").data(data).enter().append("text")
                .attr("x", d => labelWidth + x(d.value) + 5).attr("y", d => y(d.key) + y.bandwidth() / 2 + 4)
                .text(d => d.value.toLocaleString()).style("font-size", "11px").style("fill", "#9ca3af");
        }
        function drawTimeColumnChart(selector, data) {
            const container = d3.select(selector); container.html("");
            if (!data.length) return;

            const w = container.node().clientWidth;
            const h = container.node().clientHeight;
            const margin = { top: 10, right: 10, bottom: 15, left: 50 };

            const svg = container.append("svg").attr("width", w).attr("height", h)
                .on("click", (e) => e.stopPropagation());

            // Binning Data (Smoothing Spikes) - Keep 5 year bins for histogram effect
            const binSize = 5;
            const binnedMap = new Map();
            data.forEach(d => {
                const bin = Math.floor(d.year / binSize) * binSize;
                if (!binnedMap.has(bin)) binnedMap.set(bin, { count: 0 });
                const b = binnedMap.get(bin);
                b.count += d.count;
            });

            // Fill gaps
            if (binnedMap.size > 0) {
                const years = Array.from(binnedMap.keys());
                const minYear = Math.min(...years);
                const maxYear = Math.max(...years);
                for (let y = minYear; y <= maxYear; y += binSize) {
                    if (!binnedMap.has(y)) binnedMap.set(y, { count: 0 });
                }
            }

            const binnedData = Array.from(binnedMap, ([year, v]) => ({
                year,
                count: v.count
            })).sort((a, b) => a.year - b.year);

            const x = d3.scaleBand()
                .domain(binnedData.map(d => d.year))
                .range([margin.left, w - margin.right])
                .padding(0.1);

            const y = d3.scaleLinear()
                .domain([0, d3.max(binnedData, d => d.count)]).nice()
                .range([h - margin.bottom, margin.top]);

            // Bar Groups
            const bars = svg.selectAll(".bar-group")
                .data(binnedData)
                .enter().append("g")
                .attr("transform", d => `translate(${x(d.year)}, 0)`);

            const activeColor = '#0ea5e9'; // Always Sky 500

            // 1. Unified Time Bar with Transitions
            bars.append("rect")
                .attr("x", 0)
                .attr("width", x.bandwidth())
                .attr("fill", "#0ea5e9") // Solid Sky 500
                .attr("y", h - margin.bottom)
                .attr("height", 0)
                .transition()
                .duration(750)
                .ease(d3.easeCubicOut)
                .attr("y", d => y(d.count))
                .attr("height", d => y(0) - y(d.count));

            bars.append("title").text(d => `Time: ${d.year}-${d.year + 4}\nCount: ${d.count}`);

            // X Axis
            if (x.bandwidth() > 0) {
                // Responsive Ticks: calculate interval based on width
                let tickInterval = 10; // Default (50 years)
                if (w < 500) tickInterval = 40; // 200 years
                else if (w < 1000) tickInterval = 20; // 100 years

                const xAxis = d3.axisBottom(x)
                    .tickValues(x.domain().filter((d, i) => i % tickInterval === 0))
                    .tickFormat(d => d);

                svg.append("g")
                    .attr("transform", `translate(0,${h - margin.bottom})`)
                    .call(xAxis)
                    .selectAll("text")
                    .style("text-anchor", "end")
                    .attr("dx", "-.8em")
                    .attr("dy", ".15em")
                    .attr("transform", w < 800 ? "rotate(-45)" : null)
                    .style("font-size", "10px")
                    .style("fill", "#64748b"); // Slate 500

                // Remove main axis line but keep ticks logic if needed, or keep line
                svg.select(".domain").remove();
            }

            // Y Axis
            const yAxis = d3.axisLeft(y)
                .ticks(5)
                .tickFormat(d3.format("d")); // Integer format

            svg.append("g")
                .attr("transform", `translate(${margin.left},0)`)
                .call(yAxis)
                .call(g => g.select(".domain").remove())
                .selectAll("text")
                .style("font-size", "10px");

            // Brushing
            const brush = d3.brushX()
                .extent([[margin.left, margin.top], [w - margin.right, h - margin.bottom]])
                .on("end", brushed);

            const gBrush = svg.append("g")
                .attr("class", "brush")
                .call(brush);

            // Restore Selection if Active
            if (FILTERS.yearRange) {
                const startBin = Math.floor(FILTERS.yearRange[0] / 5) * 5;
                // Assuming max year of range also aligns or we cover it
                const endBinRaw = FILTERS.yearRange[1];
                // We want to cover the bin containing endBinRaw.
                // If range is [1850, 1854], endBinRaw=1854. Bin is 1850.
                // We need to map bins.
                // Simple approach: min bin and max bin.
                const endBin = Math.floor(endBinRaw / 5) * 5;

                const x0 = x(startBin);
                const x1 = x(endBin);

                if (x0 !== undefined && x1 !== undefined) {
                    // x1 is start of endBin. We want full endBin width.
                    const x1Final = x1 + x.bandwidth();
                    // Avoid infinite loop by clearing handler locally or checking event?
                    // brush.move triggers 'start', 'brush', 'end'. 
                    // Our brushed handler checks 'sourceEvent'. safe.
                    gBrush.call(brush.move, [x0, x1Final]);
                }
            }

            function brushed({ selection, sourceEvent }) {
                if (!sourceEvent) return; // Ignore programmatic moves

                if (!selection) {
                    FILTERS.yearRange = null;
                } else {
                    const [x0, x1] = selection;
                    // Find bins strictly/mostly inside
                    const selected = binnedData.filter(d => {
                        const bx = x(d.year);
                        const bw = x.bandwidth();
                        // Center point check for robust selection
                        const cx = bx + bw / 2;
                        return cx >= x0 && cx <= x1;
                    });

                    if (selected.length > 0) {
                        const minYear = selected[0].year;
                        const maxYear = selected[selected.length - 1].year + 4;
                        FILTERS.yearRange = [minYear, maxYear];
                    } else {
                        FILTERS.yearRange = null;
                    }
                }
                updateDashboard();
            }
        }

    </script>
