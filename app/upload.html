<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVDA Dataset Curation</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter for Clean Dashboard Aesthetics -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f9fafb; /* bg-gray-50 */
      color: #1f2937; /* text-gray-800 */
    }
    .dashboard-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between py-4 px-4">
  
  <header class="max-w-6xl w-full mx-auto mb-3 shrink-0 flex items-center justify-between border-b border-gray-200 pb-4">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-indigo-50 text-indigo-600 rounded-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V4a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-bold text-gray-900 tracking-tight">IVDA Dataset Curation</h1>
        <p class="text-xs text-gray-500">Digital editions and Documents overview & TEI XML ingestion pipeline</p>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-6xl w-full mx-auto mt-2 mb-6 px-4">
    <div id="mainCard" class="w-full dashboard-card rounded-xl p-6 md:p-8 flex flex-col gap-8">
      
      <!-- Left Column: Forms and Lists -->
      <div id="leftColumn" class="flex-1 flex flex-col min-w-0">
        
        <!-- Ingestion Form Panel (hidden by default) -->
        <div id="panelUpload" class="hidden space-y-6">
          <button onclick="showCurationRegistry()" class="text-indigo-600 hover:text-indigo-800 text-xs font-semibold flex items-center gap-1 focus:outline-none mb-2 w-fit">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Curation Registry
          </button>

          <div>
            <label for="editionSelect" class="block text-sm font-medium text-gray-700 mb-1.5">Digital Edition</label>
            <div id="selectEditionContainer" class="relative">
              <select id="editionSelect" class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900 mb-2">
                <option value="" disabled selected>Select an existing edition...</option>
                <!-- Populated dynamically -->
              </select>
            </div>
            <div class="flex items-center gap-1.5 mb-2">
              <span class="text-xs text-gray-400">or</span>
              <button id="toggleEditionBtn" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium hover:underline focus:outline-none" onclick="toggleCustomEditionMode()">Create a new edition</button>
            </div>
            
            <!-- New Edition Fields -->
            <div id="newEditionFields" class="hidden space-y-3">
              <input type="text" id="customEdition" placeholder="Enter new edition name (e.g. cody_archive)..." class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900" />
              <textarea id="customEditionDesc" placeholder="Enter edition description..." class="w-full h-20 bg-white border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900 resize-none"></textarea>
              <input type="text" id="customEditionWeb" placeholder="Enter website URL (optional)..." class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900" />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">TEI XML Documents</label>
            <div id="dropzone" class="border-2 border-dashed border-gray-300 hover:border-indigo-500 bg-gray-50 hover:bg-indigo-50/20 rounded-xl p-8 text-center cursor-pointer transition-all duration-200 flex flex-col items-center justify-center group">
              <svg class="w-10 h-10 text-gray-400 group-hover:text-indigo-500 transition-colors duration-200 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
              </svg>
              <p class="text-sm font-medium text-gray-700">Drag and drop XML files here</p>
              <p class="text-xs text-gray-400 mt-1">or click to browse local files</p>
              <input type="file" id="fileInput" multiple accept=".xml" class="hidden" />
            </div>
          </div>

          <button id="uploadBtn" onclick="processFiles()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-2.5 px-4 rounded-lg shadow-sm active:scale-[0.99] transition-all duration-100 focus:outline-none text-sm">
            Run Ingestion Pipeline
          </button>
        </div>

        <!-- Curation/Dataset Management Panel -->
        <div id="panelManage" class="space-y-4 pr-1">
          <!-- Dynamically populated management content -->
          <div id="manageContent" class="space-y-3">
            <div class="text-gray-400 text-xs text-center py-16">
              Loading active dataset information...
            </div>
          </div>
        </div>
      </div>

      <div id="queueColumn" class="flex-1 flex flex-col border-t md:border-t-0 md:border-l border-gray-200 pt-6 md:pt-0 md:pl-6 min-w-0">
        <h3 class="text-sm font-semibold uppercase tracking-wider text-gray-500 mb-4 flex justify-between items-center">
          <span class="flex items-center gap-2">
            <span>Processing Queue</span>
            <span id="queueCount" class="text-xs bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full font-medium">0</span>
          </span>
          <button id="clearQueueBtn" onclick="clearQueue()" class="text-[10px] text-gray-400 hover:text-red-500 font-semibold focus:outline-none hidden">
            Clear Queue
          </button>
        </h3>
        <div id="logQueue" class="flex-1 overflow-y-auto max-h-[400px] md:max-h-none space-y-3 pr-1 text-sm text-gray-700">
          <div class="text-gray-400 text-xs text-center py-16">
            No files currently in queue.
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="max-w-6xl w-full mx-auto text-center shrink-0 border-t border-gray-200 pt-4 flex flex-col md:flex-row justify-between items-center text-xs text-gray-400">
    <p>&copy; 2026 IVDA ORD Xplore</p>
    <a href="index.html" class="mt-2 md:mt-0 text-indigo-600 hover:text-indigo-800 font-semibold hover:underline inline-flex items-center gap-1">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Back to Explorer Dashboard
    </a>
  </footer>

  <script>
    let filesList = [];
    let isCustomEditionMode = false;
    const TOPICS_MAP = new Map();

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
    }

    // Load existing editions list on load
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/dashboard');
        if (res.ok) {
          const data = await res.json();
          const selectEl = document.getElementById('editionSelect');
          data.editions.forEach(ed => {
            const opt = document.createElement('option');
            opt.value = ed.name;
            opt.textContent = ed.name.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            selectEl.appendChild(opt);
          });

          if (data.topics) {
            data.topics.forEach(t => {
              TOPICS_MAP.set(t.id, t.name);
            });
          }
        }
      } catch (err) {
        console.error('Failed to load editions:', err);
      }
      showCurationRegistry();
    });

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');

    dropzone.addEventListener('click', () => fileInput.click());

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('border-indigo-500', 'bg-indigo-500/5');
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('border-indigo-500', 'bg-indigo-500/5');
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('border-indigo-500', 'bg-indigo-500/5');
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    function handleFiles(files) {
      for (const file of files) {
        if (file.name.toLowerCase().endsWith('.xml')) {
          if (!filesList.some(f => f.name === file.name)) {
            filesList.push(file);
          }
        }
      }
      renderQueue();
    }

    function renderQueue() {
      const container = document.getElementById('logQueue');
      const countEl = document.getElementById('queueCount');
      countEl.textContent = filesList.length;

      if (filesList.length === 0) {
        container.innerHTML = `<div class="text-gray-400 text-xs text-center py-16">No files currently in queue.</div>`;
        return;
      }

      container.innerHTML = '';
      filesList.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'p-3.5 rounded-lg bg-white border border-gray-200 shadow-sm transition-all duration-200';
        item.id = `item-${index}`;
        item.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="truncate pr-4 flex-1">
              <p class="font-semibold text-xs text-gray-900 truncate">${file.name}</p>
              <p class="text-[10px] text-gray-400 mt-0.5">${(file.size / 1024).toFixed(1)} KB</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="status-badge text-[9px] font-bold uppercase tracking-wider text-gray-400 bg-gray-150 border border-gray-200 px-1.5 py-0.5 rounded">Ready</span>
              <button class="text-gray-400 hover:text-red-500 text-sm focus:outline-none ml-1 font-bold" onclick="removeQueueItem(${index})">&times;</button>
            </div>
          </div>
          <div class="details-section hidden" id="details-${index}"></div>
        `;
        container.appendChild(item);
      });

      const clearBtn = document.getElementById('clearQueueBtn');
      if (filesList.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
    }

    function removeQueueItem(index) {
      filesList.splice(index, 1);
      renderQueue();
    }

    function clearQueue() {
      filesList = [];
      renderQueue();
    }

    function toggleCustomEditionMode() {
      const selectContainer = document.getElementById('selectEditionContainer');
      const fieldsContainer = document.getElementById('newEditionFields');
      const toggleBtn = document.getElementById('toggleEditionBtn');
      const customEl = document.getElementById('customEdition');
      isCustomEditionMode = !isCustomEditionMode;

      if (isCustomEditionMode) {
        selectContainer.classList.add('hidden');
        fieldsContainer.classList.remove('hidden');
        toggleBtn.textContent = 'Select an existing edition';
        customEl.focus();
      } else {
        selectContainer.classList.remove('hidden');
        fieldsContainer.classList.add('hidden');
        toggleBtn.textContent = 'Create a new edition';
      }
    }

    function toggleDetails(index) {
      const el = document.getElementById(`details-${index}`);
      if (el) el.classList.toggle('hidden');
    }

    function buildDatesList(dates) {
      let html = '';
      if (dates.creation && dates.creation.length > 0) {
        const unique = [...new Set(dates.creation)];
        html += `<div><span class="text-gray-400">Creation:</span> <span class="font-medium text-gray-800">${unique.join(', ')}</span></div>`;
      }
      if (dates.publication && dates.publication.length > 0) {
        const unique = [...new Set(dates.publication)];
        html += `<div><span class="text-gray-400">Publication:</span> <span class="font-medium text-gray-800">${unique.join(', ')}</span></div>`;
      }
      if (dates.contextual && dates.contextual.length > 0) {
        const unique = [...new Set(dates.contextual)];
        html += `<div><span class="text-gray-400">Contextual:</span> <span class="font-medium text-gray-800">${unique.join(', ')}</span></div>`;
      }
      return html || '<span class="text-gray-400 italic">No dates resolved</span>';
    }

    function buildGeosList(geos) {
      let html = '';
      if (geos.creation && geos.creation.length > 0) {
        const unique = [...new Set(geos.creation)];
        html += `<div><span class="text-gray-400">Creation:</span> <span class="font-medium text-gray-800">${unique.join(', ')}</span></div>`;
      }
      if (geos.publication && geos.publication.length > 0) {
        const unique = [...new Set(geos.publication)];
        html += `<div><span class="text-gray-400">Publication:</span> <span class="font-medium text-gray-800">${unique.join(', ')}</span></div>`;
      }
      if (geos.contextual && geos.contextual.length > 0) {
        const unique = [...new Set(geos.contextual)];
        html += `<div><span class="text-gray-400">Contextual:</span> <span class="font-medium text-gray-800">${unique.join(', ')}</span></div>`;
      }
      return html || '<span class="text-gray-400 italic">No places resolved</span>';
    }

    async function processFiles() {
      if (filesList.length === 0) {
        alert('Please add at least one TEI XML file first.');
        return;
      }

      let edName = '';
      if (isCustomEditionMode) {
        edName = document.getElementById('customEdition').value.trim();
      } else {
        edName = document.getElementById('editionSelect').value;
      }

      if (!edName) {
        alert('Please select or enter an edition name.');
        return;
      }

      const formattedEdition = edName.toLowerCase().replace(/[\s-]+/g, '_').replace(/[^a-z0-9_]/g, '');

      if (!formattedEdition) {
        alert('Invalid edition name format. Use letters, numbers, and spaces.');
        return;
      }

      const uploadBtn = document.getElementById('uploadBtn');
      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Processing...';

      for (let i = 0; i < filesList.length; i++) {
        const file = filesList[i];
        const itemEl = document.getElementById(`item-${i}`);
        if (!itemEl) continue;

        const badge = itemEl.querySelector('.status-badge');
        
        // Skip files that have already been processed successfully or marked unsuitable
        if (badge.textContent === 'Success' || badge.textContent === 'Unsuitable') {
          continue;
        }

        badge.className = 'status-badge text-[9px] font-bold uppercase tracking-wider text-indigo-700 bg-indigo-50 border border-indigo-100 px-1.5 py-0.5 rounded animate-pulse';
        badge.textContent = 'Analyzing';

        try {
          const content = await readFileAsText(file);
          
          // --- STEP 1: PRE-ANALYSIS ROUTE ---
          const analyzeRes = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              filename: file.name,
              content: content
            })
          });

          if (!analyzeRes.ok) {
            throw new Error(`Pre-analysis failed status ${analyzeRes.status}`);
          }

          const analyzeData = await analyzeRes.json();

          if (analyzeData.suitable) {
            // Document is suitable -> run standard ingestion!
            badge.className = 'status-badge text-[9px] font-bold uppercase tracking-wider text-indigo-700 bg-indigo-50 border border-indigo-100 px-1.5 py-0.5 rounded animate-pulse';
            badge.textContent = 'Ingesting';
            await runIngestAPI(file, content, formattedEdition, i, badge, itemEl);
          } else {
            // Document is structurally different -> show pre-analysis report
            badge.className = 'status-badge text-[9px] font-bold uppercase tracking-wider text-amber-700 bg-amber-50 border border-amber-100 px-1.5 py-0.5 rounded';
            badge.textContent = 'Unsuitable';

            const detailsContainer = itemEl.querySelector('.details-section');
            detailsContainer.innerHTML = `
              <div class="mt-3 pt-3 border-t border-gray-100 text-xs text-gray-700 space-y-2.5">
                <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-amber-900 space-y-1">
                  <span class="block font-bold text-amber-800 uppercase tracking-wider text-[9px]">Pre-Analysis Suitability Warning</span>
                  <p class="font-semibold text-xs mt-0.5">Detected Structure: ${analyzeData.detectedType}</p>
                  <p class="font-normal text-[11px] leading-relaxed text-amber-800">${analyzeData.reason}</p>
                </div>

                <div>
                  <span class="block font-bold text-gray-400 uppercase tracking-wider text-[9px] mb-1">Information Found</span>
                  <ul class="list-disc pl-4 space-y-1 text-gray-700 text-[11px]">
                    ${analyzeData.extractableData.map(d => `<li>${d}</li>`).join('')}
                  </ul>
                </div>
                ${analyzeData.suggestions && analyzeData.suggestions.length > 0 ? `
                <div>
                  <span class="block font-bold text-gray-400 uppercase tracking-wider text-[9px] mb-0.5">
                    ${analyzeData.aiGenerated ? 'AI-Generated Structuring Suggestions' : 'Alternative Suggestions'}
                  </span>
                  ${analyzeData.aiGenerated ? '<p class="text-[9px] text-gray-400 italic mb-1.5">Contextual recommendations generated dynamically from your TEI XML structure</p>' : ''}
                  <ul class="list-decimal pl-4 space-y-1 text-gray-700 text-[11px] font-medium">
                    ${analyzeData.suggestions.map(s => `<li>${s}</li>`).join('')}
                  </ul>
                </div>
                ` : ''}

                <div class="pt-2 flex justify-end">
                  <button onclick="forceIngest(${i})" class="bg-white hover:bg-gray-50 border border-gray-300 text-gray-700 font-semibold px-2.5 py-1 rounded text-[10px] focus:outline-none flex items-center gap-1">
                    <svg class="w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    Force Ingest Anyway
                  </button>
                </div>
              </div>
            `;
            detailsContainer.classList.remove('hidden');
          }
        } catch (err) {
          badge.className = 'status-badge text-[9px] font-bold uppercase tracking-wider text-rose-700 bg-rose-50 border border-rose-100 px-1.5 py-0.5 rounded';
          badge.textContent = 'Failed';
          badge.title = err.message || 'Unknown error occurred';
          
          const detailsContainer = itemEl.querySelector('.details-section');
          if (detailsContainer) {
            detailsContainer.innerHTML = `
              <div class="mt-3 pt-3 border-t border-gray-100 text-xs text-rose-700 space-y-2.5">
                <div class="bg-rose-50 border border-rose-200 rounded-lg p-3 text-rose-900 space-y-1">
                  <span class="block font-bold text-rose-800 uppercase tracking-wider text-[9px]">Ingestion Error</span>
                  <p class="font-normal text-[11px] leading-relaxed text-rose-800">${escapeHtml(err.message || 'An error occurred during upload.')}</p>
                  ${file.size > 4.5 * 1024 * 1024 ? `
                    <p class="text-[10px] text-rose-700 font-semibold mt-1.5">
                      ⚠️ Note: This file is ${(file.size / (1024 * 1024)).toFixed(1)} MB. Vercel Serverless Functions limit upload payloads to 4.5 MB. Please split the XML file into smaller chunks to upload.
                    </p>
                  ` : ''}
                </div>
              </div>
            `;
            detailsContainer.classList.remove('hidden');
          }
        }
      }

      uploadBtn.disabled = false;
      uploadBtn.textContent = 'Run Ingestion Pipeline';
    }

    async function forceIngest(index) {
      const file = filesList[index];
      const itemEl = document.getElementById(`item-${index}`);
      if (!itemEl) return;

      const badge = itemEl.querySelector('.status-badge');
      badge.className = 'status-badge text-[9px] font-bold uppercase tracking-wider text-indigo-700 bg-indigo-50 border border-indigo-100 px-1.5 py-0.5 rounded animate-pulse';
      badge.textContent = 'Ingesting';

      let edName = '';
      if (isCustomEditionMode) {
        edName = document.getElementById('customEdition').value.trim();
      } else {
        edName = document.getElementById('editionSelect').value;
      }
      const formattedEdition = edName.toLowerCase().replace(/[\s-]+/g, '_').replace(/[^a-z0-9_]/g, '');

      try {
        const content = await readFileAsText(file);
        await runIngestAPI(file, content, formattedEdition, index, badge, itemEl);
      } catch (err) {
        badge.className = 'status-badge text-[9px] font-bold uppercase tracking-wider text-rose-700 bg-rose-50 border border-rose-100 px-1.5 py-0.5 rounded';
        badge.textContent = 'Failed';
        badge.title = err.message || 'Unknown error occurred';
        
        const detailsContainer = itemEl.querySelector('.details-section');
        if (detailsContainer) {
          detailsContainer.innerHTML = `
            <div class="mt-3 pt-3 border-t border-gray-100 text-xs text-rose-700 space-y-2.5">
              <div class="bg-rose-50 border border-rose-200 rounded-lg p-3 text-rose-900 space-y-1">
                <span class="block font-bold text-rose-800 uppercase tracking-wider text-[9px]">Ingestion Error</span>
                <p class="font-normal text-[11px] leading-relaxed text-rose-800">${escapeHtml(err.message || 'An error occurred during force-upload.')}</p>
                ${file.size > 4.5 * 1024 * 1024 ? `
                  <p class="text-[10px] text-rose-700 font-semibold mt-1.5">
                    ⚠️ Note: This file is ${(file.size / (1024 * 1024)).toFixed(1)} MB. Vercel Serverless Functions limit upload payloads to 4.5 MB. Please split the XML file into smaller chunks to upload.
                  </p>
                ` : ''}
              </div>
            </div>
          `;
          detailsContainer.classList.remove('hidden');
        }
      }
    }

    async function runIngestAPI(file, content, formattedEdition, i, badge, itemEl) {
      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          filename: file.name,
          content: content,
          edition: formattedEdition,
          editionDescription: isCustomEditionMode ? document.getElementById('customEditionDesc').value.trim() : undefined,
          editionWebsite: isCustomEditionMode ? document.getElementById('customEditionWeb').value.trim() : undefined
        })
      });

      const data = await res.json();
      if (res.ok) {
        const warnings = data.warnings || [];
        const detailsContainer = itemEl.querySelector('.details-section');

        if (warnings.length > 0) {
          badge.className = 'status-badge text-[9px] font-bold uppercase tracking-wider text-amber-700 bg-amber-50 border border-amber-100 px-1.5 py-0.5 rounded';
          badge.textContent = 'Partial';
          badge.title = warnings.join('\n');
        } else {

    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = (e) => reject(new Error('File reading failed'));
        reader.readAsText(file);
      });
    }

          <svg class="animate-spin h-5 w-5 text-gray-400 mx-auto mb-2" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>

      try {
        const res = await fetch(`/api/manage?editionId=${editionId}`);
        if (!res.ok) throw new Error('Failed to load documents');
        const data = await res.json();
        renderCurationDocuments(data.documents || [], editionId, editionName);

        container.innerHTML = `
          <div class="bg-rose-50 border border-rose-100 rounded-lg p-4 text-xs text-rose-800">

        return `

              const isExcluded = doc.is_excluded;

                    <span class="${isExcluded ? 'text-gray-400 line-through' : 'font-semibold text-gray-800'} block truncate" title="${doc.name}">${doc.name}</span>
                    <div class="flex items-center gap-2">

                        Details
                      </button>

                  </div>
                  
                  ${isExcluded ? `
                    <button onclick="toggleDocumentExclusion(${doc.id}, false, ${editionId}, '${editionName}')" class="text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50/50 px-2 py-1 rounded font-semibold text-[10px] transition-colors shrink-0" title="Include document">

              </div>

            }).join('')}

              Editions
            </button>
            <span class="text-gray-300">/</span>
            <span class="text-gray-700 text-xs font-bold truncate max-w-[200px]" title="${editionName}">${editionName.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}</span>
          </div>
          <button onclick="showUploadFormForEdition('${editionName}')" class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-1.5 px-3 rounded-lg shadow-sm text-xs focus:outline-none transition-all flex items-center gap-1.5 active:scale-[0.99]">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Upload Documents
          </button>

        <input type="text" id="docSearch" placeholder="Search documents by name..." class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900 mb-3" />

        <div id="docListContainer">
          ${drawList(documents)}
        </div>

      // Set up simple live-search listener
      const searchInput = document.getElementById('docSearch');
      const listContainer = document.getElementById('docListContainer');
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        const filtered = documents.filter(d => d.name.toLowerCase().includes(query));
        listContainer.innerHTML = drawList(filtered);
      });

    async function toggleEditionExclusion(id, isExcluded, name) {
      const dispName = name.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      const confirmMsg = isExcluded
        ? `Are you sure you want to exclude the digital edition "${dispName}"?\nIts documents will be hidden from dashboard statistics, but remain in the database.`
        : `Are you sure you want to re-include the digital edition "${dispName}"?\nIts documents will be restored to dashboard statistics immediately.`;
      
      const confirm = window.confirm(confirmMsg);
      if (!confirm) return;

      try {
        const res = await fetch('/api/manage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'toggle_edition_exclusion', id, isExcluded })
        });
        if (!res.ok) throw new Error('Request failed');
        loadCurationData();
      } catch (err) {
        alert(`Failed to toggle edition exclusion: ${err.message}`);
      }
    }

    async function toggleDocumentExclusion(id, isExcluded, editionId, editionName) {
      try {
        const res = await fetch('/api/manage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'toggle_document_exclusion', id, isExcluded })
        });
        if (!res.ok) throw new Error('Request failed');
        loadEditionDocuments(editionId, editionName);
      } catch (err) {
        alert(`Failed to toggle document exclusion: ${err.message}`);
      }
    }

        // Populate metadata card using same formats as success upload lists!
        el.innerHTML = `
          <div class="grid grid-cols-2 gap-2 mt-1 bg-gray-50 rounded p-2.5 border border-gray-150">
            <div>
              <span class="block font-bold text-gray-400 uppercase tracking-wider text-[8px]">Language Detection</span>
              <span class="font-medium text-gray-800 text-[11px]">${data.metadata.language.toUpperCase()} ${data.metadata.languageInferred ? '<span class="text-amber-600 text-[9px]">(Inferred)</span>' : '<span class="text-emerald-600 text-[9px]">(Confirmed)</span>'}</span>
            </div>
            <div>
              <span class="block font-bold text-gray-400 uppercase tracking-wider text-[8px]">XML Complexity</span>
              <span class="font-medium text-gray-800 text-[11px]">${data.metadata.tags} elements</span>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 bg-gray-50 rounded p-2.5 border border-gray-150">
            <div>
              <span class="block font-bold text-gray-400 uppercase tracking-wider text-[8px]">Dates Logged</span>
              <div class="space-y-0.5 mt-0.5 text-[10px]">
                ${buildDatesList(data.metadata.dates)}
              </div>
            </div>
            <div>
              <span class="block font-bold text-gray-400 uppercase tracking-wider text-[8px]">Places Logged</span>
              <div class="space-y-0.5 mt-0.5 text-[10px]">
                ${buildGeosList(data.metadata.geolocations)}
              </div>
            </div>
          </div>

          <div class="bg-gray-50 rounded p-2.5 border border-gray-150">
            <span class="block font-bold text-gray-400 uppercase tracking-wider text-[8px] mb-1">Identified Features</span>
            <div class="flex flex-wrap gap-1">
              ${data.metadata.features.length > 0 ? data.metadata.features.map(f => `<span class="bg-indigo-50 text-indigo-700 border border-indigo-100 px-1.5 py-0.5 rounded font-mono text-[8px] font-medium">${f}</span>`).join('') : '<span class="text-gray-400 italic text-[9px]">None detected</span>'}
            </div>
          </div>

          <div class="bg-gray-50 rounded p-2.5 border border-gray-150">
            <span class="block font-bold text-gray-400 uppercase tracking-wider text-[8px] mb-1">Assigned Topics</span>
            <div class="space-y-1.5">
              ${data.metadata.topics.length > 0 ? data.metadata.topics.map(t => {
                const topicName = TOPICS_MAP.get(t.id) || t.id;
                return `
                <div class="flex items-center gap-2">
                  <span class="font-medium text-gray-700 shrink-0 text-[10px] w-48 truncate" title="${topicName} (${t.id})">${topicName}</span>
                  <div class="flex-1 bg-gray-200 h-1 rounded-full overflow-hidden">
                    <div class="bg-indigo-600 h-full rounded-full" style="width: ${t.confidence * 100}%"></div>
                  </div>
                  <span class="text-gray-500 font-medium text-[9px] shrink-0 w-8 text-right">${(t.confidence * 100).toFixed(0)}%</span>
                </div>
                `;
              }).join('') : '<span class="text-gray-400 italic text-[9px]">No topics matched</span>'}
            </div>
          </div>
        `;
      } catch (err) {
        el.innerHTML = `<span class="text-rose-700 italic text-[10px]">Error loading details: ${err.message}</span>`;
      }
    }
  </script>
</body>
</html>
